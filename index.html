<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Touchline · Your learning hub</title><link rel="stylesheet" href="/web.bundle.css"><link rel="stylesheet" href="/style.css"><script type="module" src="/web.bundle.js"></script></head>
<body>
<div id="app-root"></div>
<noscript>Enable JavaScript to open your local learning hub.</noscript>
<template id="legacy-workspace">
<a class="skip" href="#main">Skip to learning plan</a>
<header><a class="brand" href="/">touchline</a><div class="header-actions" id="header-actions-slot" data-renderer="react"></div><input id="import" type="file" accept="application/json" hidden disabled></header>
<div class="hub-bar"><label for="curriculum-select">Your curricula</label><select id="curriculum-select" disabled></select><button id="add-curriculum" disabled>Import curriculum</button><button id="template" disabled>Download template</button><input id="curriculum-file" type="file" accept="application/json" hidden></div>
<div id="notice" role="status" aria-live="polite">Loading your curriculum…</div>
<main id="main"><div hidden><h1 id="plan-title"></h1><p id="plan-subtitle"></p><p id="plan-description"></p><span id="completed"></span><span id="hours"></span><span id="experiments-count"></span><span id="duration"></span><span id="pace"></span><div id="resume-slot" data-renderer="react"></div><div id="progress-slot" data-renderer="react"></div></div>
<div class="toolbar"><nav aria-label="Workspace" id="navigation-slot" data-renderer="react"></nav><span id="save-state">No changes yet</span><button id="retry" hidden>Retry save</button></div>
<section id="home-view" data-renderer="react" hidden></section><section id="library-view" data-renderer="react" hidden></section>
<section id="curriculum-view" class="workspace"><aside><div class="aside-title"><h2>The learning path</h2><span id="module-count"></span></div><div id="modules"></div><p class="aside-note">Move at the pace of understanding. Complete a stage when you can show the evidence.</p></aside><article id="module-detail"></article></section>
<section id="experiments-view" class="view" hidden><div class="section-heading"><p class="eyebrow">KEEP THE RESULTS, EVEN WHEN THEY DISAPPOINT</p><h2>Experiment journal</h2><p>Record the question before you run the experiment. Record what changed after.</p></div><form id="experiment-form"><div class="form-grid"><label>Experiment title<input name="title" required maxlength="200" placeholder="Does recent form beat home advantage?"></label><label>Related module<select name="module" id="experiment-module"></select></label></div><label>Hypothesis and setup<textarea name="hypothesis" required placeholder="Prediction, dataset version, date split, baseline, metric, seed, and the one variable you will change."></textarea></label><label>Results and next step<textarea name="result" placeholder="Metric values, uncertainty, failures, code location, and your next question. Leave blank for a planned experiment."></textarea></label><button type="submit" class="primary">Record experiment</button></form><div id="experiment-list"></div></section>
<section id="guide-view" class="view" hidden></section>
<section id="sync-view" data-feature="connection" class="view" hidden><p class="eyebrow">YOUR BACKEND. YOUR RECORDS.</p><h2>Connect your devices</h2><p>Publish your current course to your private Supabase project. The native app reads the latest published copy.</p><p id="cloud-status" role="status" aria-live="polite">Not connected.</p><form id="cloud-connection"><label>Supabase project URL<input id="cloud-url" type="url" required placeholder="https://your-project.supabase.co"></label><label>Publishable key<input id="cloud-key" required autocomplete="off" placeholder="sb_publishable_…"></label><button type="submit">Connect backend</button><button type="button" id="export-connection">Export connection for iOS</button></form><form id="cloud-auth"><div class="form-grid"><label>Owner email<input id="cloud-email" type="email" autocomplete="username" required></label><label>Password<input id="cloud-password" type="password" autocomplete="current-password" minlength="12" required></label></div><button type="submit" class="primary">Sign in</button><button type="button" id="cloud-signup">Create owner account</button><button type="button" id="cloud-signout">Sign out</button></form><p class="muted">Only the owner email configured in your backend can create an account. Confirm the email before signing in.</p><div class="sync-actions"><button id="cloud-upload" class="primary">Publish current course</button><button id="cloud-refresh">Refresh cloud course list</button></div><div id="cloud-courses"></div><p class="muted">Publishing is explicit. Local edits stay on this computer until you publish again. Downloading replaces local progress only after confirmation.</p></section>
</main><footer>Touchline / A curriculum built around doing.<span>Save locally. Publish to your private backend when ready.</span></footer>
</template>
</body></html>
