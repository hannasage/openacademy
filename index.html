<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Schola · Your learning hub</title><link rel="stylesheet" href="/web.bundle.css"><link rel="stylesheet" href="/style.css"><script type="module" src="/web.bundle.js"></script></head>
<body>
<div id="app-root"></div>
<noscript>Enable JavaScript to open your local learning hub.</noscript>
<template id="legacy-workspace">
<a class="skip" href="#main">Skip to learning plan</a>
<header><a class="brand" href="/">touchline</a><div class="header-actions" id="header-actions-slot" data-renderer="react"></div><input id="import" type="file" accept="application/json" hidden disabled></header>
<div class="hub-bar"><label for="curriculum-select">Your curricula</label><select id="curriculum-select" disabled></select><button id="add-curriculum" disabled>Import curriculum</button><button id="template" disabled>Download template</button><input id="curriculum-file" type="file" accept="application/json" hidden></div>
<div id="notice" role="status" aria-live="polite">Loading your curriculum…</div>
<section id="record-recovery" class="learning-card" aria-label="Local record recovery" hidden></section>
<main id="main"><div hidden><h1 id="plan-title"></h1><p id="plan-subtitle"></p><p id="plan-description"></p><span id="completed"></span><span id="hours"></span><span id="experiments-count"></span><span id="duration"></span><span id="pace"></span><div id="resume-slot" data-renderer="react"></div><div id="progress-slot" data-renderer="react"></div></div>
<div class="toolbar"><nav aria-label="Workspace" id="navigation-slot" data-renderer="react"></nav><span id="save-state">No changes yet</span><button id="retry" hidden>Retry save</button></div>
<section id="home-view" data-renderer="react" hidden></section><section id="library-view" data-renderer="react" hidden></section>
<section id="curriculum-view" class="workspace"><aside><div class="aside-title"><h2>The learning path</h2><span id="module-count"></span></div><div id="modules"></div><p class="aside-note">Move at the pace of understanding. Complete a stage when you can show the evidence.</p></aside><article id="module-detail"></article></section>
<section id="experiments-view" class="view journal-screen" hidden><div class="learning-title-row lesson-context"><p id="journal-curriculum"></p><button id="journal-switch" type="button">Switch curriculum</button></div><h1>Keep the reasoning, not just the winning run.</h1><p class="learning-intro">Record a hypothesis before a run. Keep the failures that changed your understanding.</p><div class="journal-grid"><aside id="experiment-list" class="learning-card" aria-label="Experiment journal"></aside><form id="experiment-form" class="learning-card"><h2 id="experiment-heading">New experiment</h2><div class="form-grid"><label>Experiment title<input name="title" required maxlength="200" placeholder="Does recent form beat home advantage?"></label><label>Related module<select name="module" id="experiment-module"></select></label></div><label>Hypothesis and setup<textarea name="hypothesis" required maxlength="20000" placeholder="Prediction, model, dataset version, date split, baseline, metric, seed, and the one variable you will change."></textarea></label><label>Results, evidence links, and next step<textarea name="result" maxlength="20000" placeholder="Record metric values and reflection. Paste links to your notebook, code, or results here. Leave blank for a planned experiment."></textarea></label><div id="experiment-evidence" class="learning-actions"></div><p class="learning-metrics">The draft saves as you work. Record the experiment when you want to add it to your journal.</p><button type="submit" class="primary">Record experiment</button></form></div></section>
<dialog id="import-review" aria-labelledby="import-title"></dialog>
<section id="guide-view" class="view" hidden></section>
<section id="sync-view" data-feature="connection" class="view" hidden><div id="connection-slot"></div></section>
</main><footer>Schola / A curriculum built around doing.<span>Save locally. Publish to your private backend when ready.</span></footer>
</template>
</body></html>
